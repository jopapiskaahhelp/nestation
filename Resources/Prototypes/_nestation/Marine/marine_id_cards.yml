  - type: IdCard
    jobTitle: job-title-marine-commander
    jobIcon: JobIconHeadOfSecurity
  - type: Access
    groups:
    - Security
    tags:
    - Command
    - Maintenance
    - External
    - GenpopEnter
    - GenpopLeave

