- type: entity
  parent: BaseMachinePowered
  id: ResourceFabricatorGlass
  name: стеклянная установка
  description: Автоматически производит листы стекла. Требует электропитания.
  components:
  - type: Sprite
    sprite: Structures/Machines/resource_fabricators/glass.rsi
    state: glass
  - type: ApcPowerReceiver
    powerLoad: 3000
  - type: ResourceFabricator
    resource: SheetGlass1
    amount: 10
    intervalSeconds: 60

