- type: htnCompound
  id: XenoCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: XenoDetourCompound
    - tasks:
        - !type:HTNCompoundTask
          task: XenoRetreatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: XenoAmbushCompound
    - tasks:
        - !type:HTNCompoundTask
          task: XenoKiteCompound
    - tasks:
        - !type:HTNCompoundTask
          task: XenoStalkCompound
    - tasks:
        - !type:HTNCompoundTask
          task: XenoRallyCompound
    - tasks:
        - !type:HTNCompoundTask
          task: XenoHuntCompound
    - tasks:
        - !type:HTNCompoundTask
          task: XenoRoamCompound
    - tasks:
        - !type:HTNCompoundTask
          task: XenoPauseCompound

- type: htnCompound
  id: XenoPauseCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:XenoHoldOperator
            maxSeconds: 0.3

- type: htnCompound
  id: XenoDetourCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickDetourPointOperator
            targetKey: DetourCoordinates
            rank: 0
            modes: [ Detour ]
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: TaskFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: DetourCoordinates
            pathfindKey: DetourPathfind
            rangeKey: MeleeRange
          preconditions:
            - !type:XenoModePrecondition
              modes: [ Detour ]
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickDetourPointOperator
            targetKey: DetourCoordinates
            rank: 1
            modes: [ Detour ]
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: TaskFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: DetourCoordinates
            pathfindKey: DetourPathfind
            rangeKey: MeleeRange
          preconditions:
            - !type:XenoModePrecondition
              modes: [ Detour ]
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickDetourPointOperator
            targetKey: DetourCoordinates
            rank: 2
            modes: [ Detour ]
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: TaskFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: DetourCoordinates
            pathfindKey: DetourPathfind
            rangeKey: MeleeRange
          preconditions:
            - !type:XenoModePrecondition
              modes: [ Detour ]
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickDetourPointOperator
            targetKey: DetourCoordinates
            rank: 3
            modes: [ Detour ]
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: TaskFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: DetourCoordinates
            pathfindKey: DetourPathfind
            rangeKey: MeleeRange
          preconditions:
            - !type:XenoModePrecondition
              modes: [ Detour ]

