- type: htnCompound
  id: XenoHuntCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickBrainTargetOperator
            targetKey: Target
            targetCoordinatesKey: TargetCoordinates
            modes: [ Attack, Detour, Duel ]
        - !type:HTNPrimitiveTask
          operator: !type:XenoStrikeOperator
            modes: [ Attack, Detour, Duel ]
          preconditions:
            - !type:XenoModePrecondition
              modes: [ Attack, Detour, Duel ]
            - !type:XenoTargetDistPrecondition
              max: 11.5
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickBrainTargetOperator
            targetKey: Target
            targetCoordinatesKey: TargetCoordinates
            modes: [ Attack, Detour, Duel ]
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: TaskFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: MeleeRange
          preconditions:
            - !type:XenoModePrecondition
              modes: [ Attack, Detour, Duel ]
            - !type:XenoTargetDistPrecondition
              min: 9

