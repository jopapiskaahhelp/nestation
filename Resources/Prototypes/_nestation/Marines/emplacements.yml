- type: startingGear
  id: NorthKoreanOfficerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitNorthKorean
    shoes: ClothingShoesBootsMerc
    head: ClothingHeadHatBeretNorthKorean

- type: startingGear
  id: NorthKoreanEliteGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitNorthKorean
    shoes: ClothingShoesBootsMerc
    head: ClothingHeadHelmetSwat
    outerClothing: ClothingOuterArmorBulletproof

- type: entity
  parent: MobNorthKoreanSoldier
  id: MobNorthKoreanOfficer
  name: Cpt. Officer
  description: An officer of the opposing army.
  components:
  - type: Loadout
    prototypes:
    - NorthKoreanOfficerGear
  - type: RandomMetadata
    nameSegments:
    - NamesNorthLast
    - NamesNorthFirst
    nameFormat: name-format-north-officer
  - type: Marine
    lecturer: true
    gunProto: WeaponRevolverPythonNorth
    criticalHealth: 40
    deadHealth: 55

- type: entity
  parent: MobNorthKoreanSoldier
  id: MobNorthKoreanElite
  name: Sgt. Elite
  description: An elite trooper of the opposing army in improved body armor.
  components:
  - type: Loadout
    prototypes:
    - NorthKoreanEliteGear
  - type: RandomMetadata
    nameSegments:
    - NamesNorthLast
    - NamesNorthFirst
    nameFormat: name-format-north-elite
  - type: Marine
    gunProto: WeaponRifleLecterMarine
    criticalHealth: 70
    deadHealth: 95

- type: entity
  parent: MobNorthKoreanSoldier
  id: MobNorthKoreanGunner
  name: Pvt. Machine gunner
  description: A machine gunner of the opposing army sitting in a firing position.
  components:
  - type: Marine
    static: true
    deleteGunOnDeath: true
    gunProto: WeaponHmgNorth
    shootRange: 20
    burstMin: 5
    burstMax: 9
    shotGap: 0.1
    burstPauseMin: 0.8
    burstPauseMax: 1.6
    aimDelayMin: 0.2
    aimDelayMax: 0.5
    criticalHealth: 55
    deadHealth: 75

- type: entity
  parent: MobNorthKoreanGunner
  id: MobNorthKoreanGunnerBunker
  name: Pvt. Bunker gunner
  components:
  - type: Marine
    shootRange: 16

- type: entity
  id: MarineSandbag
  name: sandbags
  description: A low wall of sandbags. Bullets fly over it until its gun is silenced.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _nestation/Structures/sandbag.rsi
    state: sandbag0
    drawdepth: Mobs
  - type: IconSmooth
    mode: CardinalFlags
    key: marine-sandbags
    base: sandbag
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      walk:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - MobMask
        layer:
        - MidImpassable
        - LowImpassable
        hard: true
      cover:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - BulletImpassable
        hard: false
  - type: MarineSandbag

- type: entity
  parent: MarkerBase
  id: MarineGunSeat
  name: gun seat
  description: Whoever stands here gets the emplacement machine gun while staying in place.
  components:
  - type: MarineGunSeat

- type: entity
  parent: MarkerBase
  id: MarineMgNest
  name: machine gun nest
  description: A ring of sandbags with a machine gunner inside. Fires in every direction.
  components:
  - type: Sprite
    layers:
    - state: red
    - state: ai
  - type: MarineEmplacement
    gunner: MobNorthKoreanGunner
    piece: MarineSandbag

- type: entity
  parent: MarkerBase
  id: MarineMgBunker
  name: pillbox
  description: A concrete pillbox with a machine gunner. The embrasure faces the rotation direction of this marker.
  components:
  - type: Sprite
    layers:
    - state: red
    - state: ai
  - type: MarineEmplacement
    bunker: true
    gunner: MobNorthKoreanGunnerBunker
    piece: WallConcrete
