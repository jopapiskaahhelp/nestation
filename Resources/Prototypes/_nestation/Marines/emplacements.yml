  id: WeaponHmgNorth
  name: L6 SAW
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/LMGs/l6.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Item
    size: Huge
    shape:
    - 0,0,4,1
  - type: Gun
    fireRate: 8
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    minAngle: 3
    maxAngle: 16
    angleIncrease: 3
    angleDecay: 12
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/lmg.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: BasicEntityAmmoProvider
    proto: CartridgeLightRifleHmg
