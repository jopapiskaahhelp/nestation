    medium: Coolant
  - type: Sprite
    drawdepth: Objects
    sprite: _nestation/Reactor/pipe_coolant.rsi
    state: coolant0
  - type: IconSmooth
    key: nestation_coolant
    base: coolant
    mode: CardinalFlags

