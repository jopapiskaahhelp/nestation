      map: [ "base" ]
  - type: GenericVisualizer
    visuals:
      enum.NestationVisuals.State:
        base:
          Off: { state: console_off }
          Running: { state: console_on }
          Hot: { state: console_on }
          Alarm: { state: console_alarm }
