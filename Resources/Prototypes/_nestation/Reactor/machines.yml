- type: entity
  parent: BaseNestationStructure
  id: NestationGenerator
  components:
  - type: Sprite
    sprite: _nestation/Reactor/generator.rsi
    layers:
    - state: gen_off
      map: [ "base" ]
  - type: GenericVisualizer
    visuals:
      enum.NestationVisuals.State:
        base:
          Off: { state: gen_off }
          Running: { state: gen_on }
          Hot: { state: gen_on }
          Alarm: { state: gen_on }
          Broken: { state: gen_off }
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-2.45,-1.45,2.45,1.45"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 200
  - type: NestationPorts
    size: 5,3
    ports:
    - side: West
      offset: -2,0
      medium: Shaft
      role: GeneratorShaft
  - type: NestationGenerator
  - type: NodeContainer
    examinable: true
    nodes:
      output:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: PowerSupplier
    supplyRampRate: 500000
    supplyRampTolerance: 100000

