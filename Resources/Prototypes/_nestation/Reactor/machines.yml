- type: entity
  parent: BaseNestationStructure
  id: NestationPoolSegment
  components:
  - type: Sprite
    sprite: _nestation/Reactor/pool.rsi
    layers:
    - state: pool0
      map: [ "base" ]
    - state: steam
      map: [ "steam" ]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.NestationVisuals.State:
        steam:
          Off: { visible: false }
          Running: { visible: false }
          Hot: { visible: true }
          Alarm: { visible: true }
          Broken: { visible: false }
  - type: IconSmooth
    key: nestation_pool
    base: pool
    mode: CardinalFlags
  - type: Rotatable
    rotateWhileAnchored: false
  - type: NestationPool
  - type: NestationPorts
    ports:
    - side: North
      medium: Cooling
      role: PoolPort
    - side: East
      medium: Cooling
      role: PoolPort
    - side: South
      medium: Cooling
      role: PoolPort
    - side: West
      medium: Cooling
      role: PoolPort
