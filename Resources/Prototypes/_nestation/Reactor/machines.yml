- type: entity
  parent: BaseNestationStructure
  id: NestationPrimaryPump
  components:
  - type: Sprite
    sprite: _nestation/Reactor/pumps.rsi
    layers:
    - state: primary_off
      map: [ "base" ]
  - type: GenericVisualizer
    visuals:
      enum.NestationVisuals.State:
        base:
          Off: { state: primary_off }
          Running: { state: primary_on }
          Hot: { state: primary_on }
          Alarm: { state: primary_on }
          Broken: { state: primary_off }
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.45,-1.45,1.45,1.45"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 200
  - type: NestationPorts
    size: 3,3
    ports:
    - side: East
      offset: 1,0
      medium: Coolant
      role: PumpIn
    - side: West
      offset: -1,0
      medium: Coolant
      role: PumpOut
  - type: NestationPump
    kind: Primary
    nominalPower: 60000

