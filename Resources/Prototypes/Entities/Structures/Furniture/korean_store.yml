    state: cig-rack-vape

- type: entity
  parent: KoreaStoreBase
  id: KoreaCigRackCabinet
  name: Korean tobacco cabinet
  description: A wooden cabinet with cartons on display and a lock below.
  components:
  - type: Sprite
    state: cig-rack-cabinet

- type: entity
  parent: KoreaStoreBase
