- type: entity
  parent: [ BaseStructure, StructureHealthFurniture ]
  id: KoreaStoreBase
  abstract: true
  components:
  - type: InteractionOutline
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: Structures/Furniture/korean_store.rsi
    noRot: true
    drawdepth: Objects

- type: entity
  parent: KoreaStoreBase
  id: KoreaCigRackTobacco
  name: Korean tobacco rack
  description: A tidy rack of cigarette packs with a Hangul sign.
  components:
  - type: Sprite
    state: cig-rack-tobacco

- type: entity
  parent: KoreaStoreBase
  id: KoreaCigRackVape
  name: Korean vape rack
  description: A glass rack of colourful vape pods with a neon sign.
