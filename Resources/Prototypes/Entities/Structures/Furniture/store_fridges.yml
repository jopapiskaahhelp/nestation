- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseStoreFridge
  components:
  - type: Sprite
    sprite: Structures/Furniture/store_fridges.rsi
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 75
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageModifierSet: Glass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 2
      - !type:ChangeConstructionNodeBehavior
        node: broken

- type: entity
  abstract: true
  parent: BaseStoreFridge
  id: BaseStoreFridgeBroken
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseStoreFridge
  id: StoreFridgeSoda
  name: холодильник с газировкой
  description: Витрина со стеклянной дверцей, внутри газировка и вода.
  components:
  - type: Sprite
    state: fridge_soda
  - type: Construction
    graph: StoreFridgeSoda
    node: fridge
    deconstructionTarget: null

- type: entity
  parent: BaseStoreFridgeBroken
  id: StoreFridgeSodaBroken
  name: разбитый холодильник с газировкой
  description: Стекло дверцы разбито, а осколки лежат на полу.
  components:
  - type: Sprite
    state: fridge_soda_broken
  - type: Construction
    graph: StoreFridgeSoda
    node: broken
    deconstructionTarget: null

- type: constructionGraph
  id: StoreFridgeSoda
  start: fridge
  graph:
  - node: fridge
    entity: StoreFridgeSoda
  - node: broken
    entity: StoreFridgeSodaBroken
    edges:
    - to: fridge
      steps:
      - material: Glass
        amount: 1
        doAfter: 2

