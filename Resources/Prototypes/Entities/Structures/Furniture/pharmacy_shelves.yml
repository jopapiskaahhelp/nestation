- type: entity
  parent: BaseStoreShelf
  id: PharmacyShelfMeds
  name: аптечный стеллаж с лекарствами
  description: Белый металлический стеллаж с коробками лекарств.
  components:
  - type: Sprite
    sprite: Structures/Furniture/pharmacy_shelves.rsi
    state: pharm_meds
  - type: Construction
    graph: PharmacyShelfMeds
    node: shelf
    deconstructionTarget: null

- type: entity
  parent: BaseStoreShelfBroken
  id: PharmacyShelfMedsBroken
  name: сломанный аптечный стеллаж с лекарствами
  description: Одна из полок выпала, а товары разбросаны.
  components:
  - type: Sprite
    sprite: Structures/Furniture/pharmacy_shelves.rsi
    state: pharm_meds_broken
  - type: Construction
    graph: PharmacyShelfMeds
    node: broken
    deconstructionTarget: null

- type: constructionGraph
  id: PharmacyShelfMeds
  start: shelf
  graph:
  - node: shelf
    entity: PharmacyShelfMeds
  - node: broken
    entity: PharmacyShelfMedsBroken
    edges:
    - to: shelf
      steps:
      - material: Steel
        amount: 1
        doAfter: 2

