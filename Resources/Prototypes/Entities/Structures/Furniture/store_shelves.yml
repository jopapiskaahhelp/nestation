- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseStoreShelf
  components:
  - type: Sprite
    sprite: Structures/Furniture/store_shelves.rsi
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 75
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
      - !type:ChangeConstructionNodeBehavior
        node: broken

- type: entity
  abstract: true
  parent: BaseStoreShelf
  id: BaseStoreShelfBroken
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseStoreShelf
  id: StoreShelfRamyeon
  name: стеллаж с лапшой
  description: Металлический стеллаж с лапшой быстрого приготовления в стаканчиках и пачках.
  components:
  - type: Sprite
    state: shelf_ramyeon
  - type: Construction
    graph: StoreShelfRamyeon
    node: shelf
    deconstructionTarget: null

- type: entity
  parent: BaseStoreShelfBroken
  id: StoreShelfRamyeonBroken
  name: сломанный стеллаж с лапшой
  description: Одна из полок выпала, а товары разбросаны.
  components:
  - type: Sprite
    state: shelf_ramyeon_broken
  - type: Construction
    graph: StoreShelfRamyeon
    node: broken
    deconstructionTarget: null

- type: constructionGraph
  id: StoreShelfRamyeon
  start: shelf
  graph:
  - node: shelf
    entity: StoreShelfRamyeon
  - node: broken
    entity: StoreShelfRamyeonBroken
    edges:
    - to: shelf
      steps:
      - material: Steel
        amount: 1
        doAfter: 2

